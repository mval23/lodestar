name: Migrate production

# Production schema changes happen only here, never by hand (CLAUDE.md).
# Run manually from the Actions tab after the change has been on staging.
# The `production` environment should require the owner's approval.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate production" to confirm'
        required: true

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'migrate production'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        run: supabase migration list
      - name: Push migrations
        run: supabase db push
